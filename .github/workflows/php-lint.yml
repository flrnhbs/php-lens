name: PHP Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 
        
      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Lint every PHP file (php -l)
        run: |
          set -e
          find . -name "*.php" -not -path "./vendor/*" -print0 \
            | xargs -0 -n1 -I{} sh -c 'echo "Linting {}"; php -l "{}"'
